# Production compose for mqtt-proxy deployments (no BLE/BlueZ deps needed).
# For direct BLE (BlueZ/D-Bus) deployments, see docker-compose.example.yml.

services:
  ble-scale-sync:
    # Pinned to a release, so an update is a change you make. To follow the
    # newest release instead, use the tag latest (or a minor line such as X.Y).
    image: ghcr.io/kristianp26/ble-scale-sync:1.42.0 # x-release-please-version
    container_name: ble-scale-sync
    volumes:
      # config.yaml is rw so the app can update last_known_weight
      - ./config.yaml:/app/config.yaml
      - garmin-tokens:/app/garmin-tokens
    environment:
      - CONTINUOUS_MODE=true
      # Your local time zone. Without it the container runs in UTC, and the
      # Intervals.icu and wger exporters file a weigh-in made shortly after
      # midnight under the previous day. Change it to your own zone.
      - TZ=Europe/Bratislava
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  garmin-tokens:
