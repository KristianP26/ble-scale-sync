version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps:"
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci:"
    labels:
      - ci

  # The Cloudflare Worker behind api.blescalesync.dev, with its own lockfile.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps:"
    labels:
      - dependencies

  # Python packages installed into every Docker image (Garmin upload).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps:"
    labels:
      - dependencies

  # Base images of the root Dockerfile, pinned by digest. Only digest and
  # patch-level moves: Node 22 is the documented runtime floor, and the Python
  # stage is copied by path (python3.12), so a minor bump would break the build.
  # The add-on Dockerfile builds FROM an ARG and has nothing to track here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build:"
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Host tools for firmware/flash.sh only. Scoped to /firmware, which now holds
  # exactly one pip manifest: the MicroPython package list was renamed to
  # mip-packages.txt because Dependabot treats any file whose name contains
  # "requirements" as a pip manifest, and its `aioble` entry collides with an
  # unrelated PyPI package.
  - package-ecosystem: pip
    directory: /firmware
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps:"
    labels:
      - dependencies
