name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install BLE system dependencies
        run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev libusb-1.0-0-dev

      - name: Install npm dependencies
        run: npm ci

      # The three BLE stacks are optionalDependencies (#364), so npm no longer
      # fails the install when one cannot be built. Four test files reach
      # node-ble / dbus-next through a real value import with no vi.mock, and
      # three type-only imports make all of them a hard requirement for
      # `tsc --noEmit`. Assert them here, or a skipped install surfaces as an
      # opaque Vite resolve error much later in the run.
      - name: Assert the optional BLE stacks installed
        run: node -e "for (const p of ['@abandonware/noble','@stoprocent/noble','node-ble','dbus-next']) require.resolve(p + '/package.json');"

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  python-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile garmin-scripts/garmin_upload.py && python -m py_compile garmin-scripts/setup_garmin.py

      - name: Run firmware unit tests
        run: python -m unittest discover -s firmware/tests -v
