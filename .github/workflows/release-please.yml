name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The secrets context is available in jobs.<id>.outputs but NOT in
      # jobs.<id>.if or in a step-level if, so the presence of NPM_TOKEN has to
      # be turned into a job output here. The expression yields the string
      # "true" or "false" and never the secret itself.
      has_npm_token: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      # Token strategy:
      # - `RELEASE_PLEASE_TOKEN` (optional PAT with `repo` + `workflow` scopes)
      #   lets the release PR trigger ci.yml and lets `release: published`
      #   trigger docker.yml, because events raised by a user-owned token
      #   chain into other workflows. Without it, GITHUB_TOKEN still creates
      #   PRs and releases, but GitHub suppresses downstream workflow runs
      #   (a documented limitation of the default token).
      # - Falls back to GITHUB_TOKEN so the workflow keeps working out of
      #   the box; maintainer can then re-run ci.yml / trigger docker.yml
      #   manually until the PAT is configured.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please owns CHANGELOG.md but cannot write a second changelog, so
      # the Home Assistant add-on copy is regenerated on the release PR branch
      # here. Without this the maintainer has to remember a manual step, which
      # is exactly how the add-on changelog fell 16 releases behind (#294), and
      # the guard in tests/addon-changelog-sync.test.ts would fail the release PR.
      # The generator imports only node: builtins, so it runs straight off
      # source with no install step.
      # Node 24: the generator is TypeScript run directly, which needs the
      # native type stripping that only recent Node has enabled by default.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync the add-on changelog on the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo-sync
          cd repo-sync
          BRANCH=$(git ls-remote --heads origin 'release-please--*' | awk '{print $2}' | sed 's#refs/heads/##' | head -1)
          if [ -z "$BRANCH" ]; then
            echo "No release-please branch, nothing to sync."
            exit 0
          fi
          # Explicit refspec: a shallow clone has no remote-tracking ref for
          # this branch, and a plain `fetch <branch>` only writes FETCH_HEAD.
          # `checkout -B` rather than `switch --track`, because a ref fetched
          # into a shallow clone is not a valid tracking start point.
          git fetch --depth 1 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          node src/tools/sync-addon-changelog.ts
          if git diff --quiet -- ble-scale-sync-addon/CHANGELOG.md; then
            echo "Add-on changelog already in sync."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ble-scale-sync-addon/CHANGELOG.md
          git commit -m 'chore(addon): sync the add-on changelog from the project changelog'
          git push origin "HEAD:$BRANCH"

  npm-publish:
    needs: release-please
    # Job outputs are strings: compare against "true", never rely on
    # truthiness. While NPM_TOKEN is unset the whole job shows as skipped
    # instead of running green with every step skipped.
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.release-please.outputs.has_npm_token == 'true'
    runs-on: ubuntu-latest
    # A job-level permissions block REPLACES the workflow-level one, so the
    # release-please job above keeps contents:write / pull-requests:write and
    # only this job gets the OIDC token that npm provenance needs.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Full install (dev included): prepublishOnly runs `npm run build`, which
      # needs typescript. --ignore-scripts keeps the native BLE stacks from
      # compiling here; the tarball only carries the compiled dist/.
      # Do NOT add --omit=optional: three type-only imports make the stacks a
      # hard requirement for tsc.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
