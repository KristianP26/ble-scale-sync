name: Deploy Docs

on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/docs.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # --ignore-scripts: this job goes on to hand a Cloudflare token to
      # wrangler, so no dependency install script gets to run before it. The
      # docs build needs no native module.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build docs
        run: npx vitepress build docs

      - name: Deploy to Cloudflare Pages
        # Pinned to a commit: this step receives the Cloudflare API token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name ble-scale-sync --branch ${{ github.ref_name }} --commit-dirty=true --no-bundle
