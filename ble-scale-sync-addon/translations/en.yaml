configuration:
  scale_mac:
    name: Scale MAC address
    description: >-
      MAC address of your scale, for example FF:03:00:13:A1:04. Leave empty
      for the first weigh-in, then copy the address from the Auto-discovered:
      or Matched: line of the log here.
  ble_transport:
    name: Bluetooth transport
    description: >-
      local (this host's adapter), ha-bluetooth (what Home Assistant already
      hears, broadcast scales only), esphome-proxy (an ESPHome proxy Home
      Assistant has not adopted) or mqtt-proxy (the ESP32 proxy firmware).
      Options below that name a transport apply only to it.
  ble_adapter:
    name: Bluetooth adapter
    description: >-
      Local transport only. The adapter to use on a host with several, such
      as hci1; leave empty for the default.
  force_scale_adapter:
    name: Force scale adapter
    description: >-
      Only if auto-detection picks the wrong protocol: the adapter name exactly
      as printed in the "Adapters:" log line, for example Hutbit. Requires the
      scale MAC, and report the misdetection so it can be fixed.
  qn_protocol_byte:
    name: QN protocol byte
    description: >-
      QN scales only (Renpho, Arboleaf, FITINDEX, GE). The first option to try
      when the scale completes the handshake in the log and never reports a
      weight: 0, then 255, then the proto value of the "QN: scale info" line.
  qn_report_byte:
    name: QN user-delete mask (deletes data)
    description: >-
      QN scales only. Leave empty: on every connection it deletes the user
      slots this value selects on the scale (252 deletes slots 3 to 8),
      including other people's stored weigh-ins.
  qn_weight_ack:
    name: QN weight acknowledgement
    description: >-
      QN scales only. Try true after the QN protocol byte and the QN user key:
      it sends your weight anchor after the start command and acknowledges
      each weight frame, as the vendor apps do.
  qn_user_key:
    name: QN user key
    description: >-
      QN scales with a scale-info frame of 18 bytes or longer only. Try 1000
      after the QN protocol byte when the debug log says the scale did not
      accept the profile; this app's user must be the vendor app's first user,
      or set the QN user slot.
  qn_user_slot:
    name: QN user slot
    description: >-
      QN scales only, with the QN user key: the user slot (1 to 8) the vendor
      app registered you in, when it is not 1. Experimental; the QN Scales
      page says where the debug log names your slot.
  qn_a4_prelude:
    name: QN A4 prelude
    description: >-
      QN scales only, the last option to try. Sends two extra frames the
      vendor app sends, which overwrite data the scale keeps for its first
      user; a session that sends them does not use the scale's own body
      composition.
  qn_time_sync_long:
    name: QN long time sync
    description: >-
      QN scales only. Try true after the QN weight acknowledgement, keeping it
      on: sends the longer clock frame with your Home Assistant time zone's
      UTC offset.
  qn_config_long:
    name: QN long config frame
    description: >-
      QN scales only. Try true after QN long time sync, keeping both options
      before it on: sends the longer settings frame the vendor app sends.
  qn_result_ack:
    name: QN result acknowledgement
    description: >-
      Experimental, QN scales with a 19-byte scale-info frame only. Sends the
      end-of-measurement frame of the vendor's SDK after the last result frame.
  rmsc04_profile_byte:
    name: Renpho R-MSC04 profile byte
    description: >-
      Renpho R-MSC04 only: one byte of the profile the Renpho app writes for
      you, as two hex digits in quotes; the scale's own body fat, skeletal
      muscle and visceral fat are then exported. It is personal, so keep it
      out of issues.
  auto_clear_stale_bond:
    name: Re-pair a scale that forgot its pairing
    description: >-
      Local transport only, for Beurer BF7xx and BF9xx scales that work once
      and then fail every connect until the pairing is removed by hand. The
      app then deletes the stale key and pairs again, but only when the
      scale clearly refused it.
  preemptive_adapter_reset:
    name: Power-cycle the adapter after every weigh-in
    description: >-
      Local transport only. Switches the adapter off and on after every
      connection to clear a stuck scanning state; leave it on unless other
      Bluetooth integrations suffer from the brief drop.
  adapter_privacy:
    name: Pair with a host identity key (LE privacy)
    description: >-
      Local transport only, for Beurer scales that ask for SET and a new
      pairing before every weigh-in. It changes the address of the whole
      adapter, so other paired devices may need pairing again; remove the
      scale's pairing once after turning it on.
  pairing_retry_max_min:
    name: Longest wait before asking to pair again (minutes)
    description: >-
      Local transport only, for scales that show a code to confirm. When
      nobody confirms it, the wait before the next attempt grows from 2
      minutes up to this value; 0 asks on every scan.
  esphome_proxy_host:
    name: ESPHome proxy host
    description: >-
      esphome-proxy only. IP address or host name of a node Home Assistant
      has not adopted, for example 192.168.1.50.
  esphome_proxy_port:
    name: ESPHome proxy port
    description: >-
      esphome-proxy only. Native API port, 6053 unless the device sets another.
  esphome_proxy_encryption_key:
    name: ESPHome API encryption key
    description: >-
      esphome-proxy only. The 44-character key under api: encryption: key: in
      the device's YAML; leave empty only for a device without API encryption.
  mqtt_proxy_broker:
    name: ESP32 proxy broker
    description: >-
      mqtt-proxy only. shared uses the broker of the MQTT options below, and
      embedded starts a broker inside this app with the port, username and
      password below.
  mqtt_proxy_device_id:
    name: ESP32 proxy device ID
    description: mqtt-proxy only. Same as device_id in the ESP32's config.json.
  mqtt_proxy_topic_prefix:
    name: ESP32 proxy topic prefix
    description: mqtt-proxy only. Same as topic_prefix in the ESP32's config.json.
  mqtt_proxy_embedded_broker_port:
    name: Embedded broker port
    description: >-
      Embedded broker only. If Mosquitto already uses 1883, pick another port
      and set the same mqtt_port in the ESP32's config.json.
  mqtt_proxy_username:
    name: Embedded broker username
    description: >-
      Embedded broker only, and required there. The ESP32 logs in with it.
  mqtt_proxy_password:
    name: Embedded broker password
    description: >-
      Embedded broker only, and required there. The ESP32 logs in with it.
  proxy_liveness_timeout_min:
    name: Proxy silence before restart (minutes)
    description: >-
      Proxy transports only: after this many minutes without any Bluetooth
      advertisement the app restarts to rebuild the link. Set 0 to turn it
      off where no other Bluetooth devices are in range.
  weight_unit:
    name: Weight unit
    description: >-
      Unit of weights in the log and notifications. Calculations use kg, and
      Home Assistant always receives kg.
  height_unit:
    name: Height unit
    description: Unit of the height below, cm or in.
  display_unit:
    name: Physical scale display unit
    description: >-
      Unit shown on the scale's own display; weight_unit follows the setting
      above. Only QN and Active Era (AC 27) scales are told the unit.
  user_name:
    name: User name
    description: Name used in the log and in the Home Assistant device.
  user_height:
    name: Height
    description: Height in the height unit above, for example 183 cm or 72 in.
  user_birth_date:
    name: Birth date
    description: Date of birth as YYYY-MM-DD, for example 1990-06-15.
  user_gender:
    name: Gender
    description: Biological sex, used in the body composition formulas.
  user_is_athlete:
    name: Athlete mode
    description: >-
      Adjusts the body composition formulas for people who train regularly.
  user_weight_min:
    name: Weight range min
    description: >-
      Lowest plausible weight for this person, in kg whatever the weight unit.
  user_weight_max:
    name: Weight range max
    description: >-
      Highest plausible weight for this person, in kg whatever the weight unit.
  user_estimate_body_composition:
    name: Estimate body composition
    description: >-
      When the scale measured no body composition, body fat, water, bone,
      muscle, visceral fat and physique rating are estimated from BMI. Turn
      off to leave them unknown instead.
  out_of_range:
    name: Readings outside the weight range
    description: >-
      warn logs such a reading and exports it. skip drops it and leaves the
      remembered weight alone, so a suitcase on the scale cannot overwrite it.
  mqtt_enabled:
    name: Enable MQTT
    description: Send measurements to an MQTT broker with Home Assistant auto-discovery.
  mqtt_auto:
    name: Auto-detect MQTT broker
    description: >-
      Use the Mosquitto broker app. Turn off to enter the broker details
      below.
  mqtt_broker_url:
    name: MQTT broker URL
    description: >-
      For example mqtt://192.168.1.10:1883, used when auto-detect is off or
      finds no broker. The ESP32 proxy with a shared broker uses it too.
  mqtt_username:
    name: MQTT username
    description: Broker username, used with the broker URL above.
  mqtt_password:
    name: MQTT password
    description: Broker password, used with the broker URL above.
  mqtt_topic:
    name: MQTT topic
    description: Base topic; each user's readings go to <topic>/<user slug>.
  mqtt_ha_discovery:
    name: HA auto-discovery
    description: Publish Home Assistant discovery messages so the sensors are created.
  mqtt_ha_device_name:
    name: HA device name
    description: Device name shown in Home Assistant.
  garmin_enabled:
    name: Enable Garmin Connect
    description: >-
      Upload measurements to Garmin Connect; the app signs in with the
      email and password below on its first start. For an account with MFA,
      see the Documentation tab.
  garmin_email:
    name: Garmin email
    description: Garmin Connect account email.
  garmin_password:
    name: Garmin password
    description: Garmin Connect account password.
  garmin_upload_timeout_sec:
    name: Garmin upload timeout (seconds)
    description: >-
      Seconds one upload attempt may take, 10 to 900, with three attempts.
      Raise it if uploads time out while the same measurement uploads fine
      later.
  garmin_weight_only:
    name: Upload weight only
    description: >-
      Send only the weight to Garmin Connect. Other exporters still receive
      the full body composition.
  scan_cooldown:
    name: Scan cooldown (seconds)
    description: >-
      Local transport only. Seconds to wait after a reading before scanning
      again, 5 to 3600.
  retry_failed_exports:
    name: Retry a failed export later
    description: >-
      Keep a reading whose upload failed and retry it for up to three days,
      for the exporters that can record a past measurement. Turn off to keep
      no queue on disk.
  idle_rescan_delay:
    name: Rescan delay when no scale was found (seconds)
    description: >-
      Local transport only. Seconds to wait after a scan that found no scale,
      0 to 3600; lower it if your scale advertises only briefly.
  no_reading_rescan_delay:
    name: Minimum wait after a session without a reading (seconds)
    description: >-
      Local transport only. Seconds to wait after a session without a reading,
      0 to 3600, for a scale that stays connectable; a weigh-in arriving more
      than 5 minutes late reaches only exporters that can record a past one.
  reset_bluetooth:
    name: Reset Bluetooth adapter on startup
    description: >-
      Power-cycle the Bluetooth adapter when the app starts, local transport
      only. Turn off if other Bluetooth integrations lose their connection
      when the app restarts.
  debug:
    name: Debug logging
    description: Verbose Bluetooth log, needed for an issue report.
  update_check:
    name: Check for updates
    description: >-
      At most once a day, ask api.blescalesync.dev for the latest version and
      log when a newer one is out. Only the app version, operating system and
      CPU architecture are sent.
  custom_config:
    name: Use custom config.yaml
    description: >-
      Use /share/ble-scale-sync/config.yaml instead of these options, for
      several users, other exporters or transport settings not listed here.
