configuration:
  scale_mac:
    name: Scale MAC address
    description: >-
      MAC address of your BLE scale (e.g., FF:03:00:13:A1:04).
      Run the BLE scan from the add-on logs to find it.
      Leave empty for auto-discovery.
  ble_adapter:
    name: Bluetooth adapter
    description: >-
      Linux HCI adapter name (e.g., hci0, hci1).
      Only needed if you have multiple Bluetooth adapters.
      Leave empty for the system default.
  force_scale_adapter:
    name: Force scale adapter
    description: >-
      Leave empty unless auto-detection picks the wrong protocol for your scale.
      Use the adapter name exactly as printed in the "Adapters:" line in the log
      (e.g. Hutbit). Requires the scale MAC to be set, because a forced adapter
      claims every device it is shown. Please also report the misdetection so it
      can be fixed for everyone.
  qn_protocol_byte:
    name: QN protocol byte
    description: >-
      QN-family scales only (Renpho, Arboleaf, FITINDEX, GE and rebadges).
      Leave empty unless your QN scale connects, completes the whole handshake
      in the log and then never reports a weight. Then try 0, or 255, or the
      value the "QN: scale info" log line shows as proto. Accepts 0 to 255.
  qn_report_byte:
    name: QN history response byte
    description: >-
      QN-family scales only, and only worth trying after the QN protocol byte
      did not help. Try 252, which is what vendor-app captures of a GE CS 10 G
      and an Arboleaf QN-Scale send where this add-on sends the default 254.
      Accepts 0 to 255.
  qn_weight_ack:
    name: QN weight acknowledgement
    description: >-
      QN-family scales only, and the last thing to try after the two QN bytes
      above. The vendor app tells the scale a real weight before the weigh-in
      and answers every weight frame with that same weight; some firmware will
      not finish a measurement otherwise. Leave empty unless your QN scale
      completes the whole handshake in the log and then reports no weight at
      all; then set true.
  qn_a4_prelude:
    name: QN A4 prelude
    description: >-
      QN-family scales only, and the last thing to try after the two QN bytes
      and the weight acknowledgement. An HCI capture of an Arboleaf vendor app
      shows two undecoded 0xA4 frames sent between the start command and the
      first weight frame, which this add-on does not send. Set true to replay
      them. The payload is one reporter's own bytes, so it may help your unit
      or do nothing. Leave empty otherwise.
  qn_time_sync_long:
    name: QN long time sync
    description: >-
      QN-family scales only, and only worth trying after everything else. The
      same Arboleaf capture shows the vendor app's clock-setting frame carrying
      one extra byte that this add-on does not send. Set true to send that
      longer frame. What the extra byte selects is not known, so this is a
      diagnostic to try, not a fix. Leave empty otherwise.
  qn_config_long:
    name: QN long config frame
    description: >-
      QN-family scales only, and the last remaining difference anyone has found
      between this add-on's start-up conversation and the vendor app's. Two
      captures show the app's settings frame carrying one byte more than this
      add-on sends. Set true to send the longer frame. What the extra bytes
      select is not known, so this is a diagnostic to try, not a fix. Leave
      empty otherwise.
  auto_clear_stale_bond:
    name: Re-pair a scale that forgot its pairing
    description: >-
      Bonded scales only (Beurer BF7xx and BF9xx). Turn this on if the scale
      works once and then every later connect fails, until you clear it by hand
      with bluetoothctl. The scale has dropped its half of the pairing while
      Home Assistant still holds the key; this lets the add-on delete that key
      and pair again on its own. Leave it off otherwise.
  proxy_liveness_timeout_min:
    name: Proxy silence before restart (minutes)
    description: >-
      ESP32 and ESPHome proxy setups only. If the proxy stops delivering
      Bluetooth advertisements entirely for this many minutes, the link is
      treated as wedged and the add-on restarts to rebuild it. Advertisements
      arrive constantly from any nearby phone or watch while the link is
      healthy, so silence means the link, not an empty house. Raise it, or set
      0 to disable, if your proxy sits somewhere with no other Bluetooth
      devices in range.
  weight_unit:
    name: Weight unit
    description: >-
      Unit the scale reports and the app uses internally.
      Choose kg for metric or lbs for imperial.
  height_unit:
    name: Height unit
    description: >-
      Unit used for the user height and weight range below.
      Choose cm for metric or in (inches) for imperial.
  user_name:
    name: User name
    description: Display name for the user profile
  user_height:
    name: Height
    description: >-
      Height in the unit selected above (e.g., 183 for cm, 72 for in)
  user_birth_date:
    name: Birth date
    description: Date of birth in YYYY-MM-DD format (e.g., 1990-06-15)
  user_gender:
    name: Gender
    description: Biological gender (used for body composition calculation)
  user_is_athlete:
    name: Athlete mode
    description: >-
      Enable if you exercise regularly (5+ hours/week).
      Adjusts body composition formulas for athletic builds.
  user_weight_min:
    name: Weight range min
    description: >-
      Minimum expected weight in the weight unit selected above
      (used for multi-user matching)
  user_weight_max:
    name: Weight range max
    description: >-
      Maximum expected weight in the weight unit selected above
      (used for multi-user matching)
  mqtt_enabled:
    name: Enable MQTT
    description: Export measurements to an MQTT broker with Home Assistant auto-discovery
  mqtt_auto:
    name: Auto-detect MQTT broker
    description: >-
      Automatically use the Mosquitto add-on broker.
      Disable to enter broker details manually.
  mqtt_broker_url:
    name: MQTT broker URL
    description: >-
      MQTT broker URL (e.g., mqtt://192.168.1.10:1883).
      Only used when auto-detect is disabled.
  mqtt_username:
    name: MQTT username
    description: MQTT broker username (only when auto-detect is disabled)
  mqtt_password:
    name: MQTT password
    description: MQTT broker password (only when auto-detect is disabled)
  mqtt_topic:
    name: MQTT topic
    description: Base topic for publishing measurements
  mqtt_ha_discovery:
    name: HA auto-discovery
    description: Publish Home Assistant MQTT discovery messages for automatic sensor creation
  mqtt_ha_device_name:
    name: HA device name
    description: Device name shown in Home Assistant
  garmin_enabled:
    name: Enable Garmin Connect
    description: >-
      Upload measurements to Garmin Connect.
      After enabling, run Garmin setup from the add-on terminal.
  garmin_email:
    name: Garmin email
    description: Garmin Connect account email
  garmin_password:
    name: Garmin password
    description: Garmin Connect account password
  scan_cooldown:
    name: Scan cooldown (seconds)
    description: Seconds to wait between BLE scans in continuous mode (5 to 3600)
  reset_bluetooth:
    name: Reset Bluetooth adapter on startup
    description: >-
      Power-cycle the Bluetooth adapter when the add-on starts.
      Helps with BlueZ stability after ungraceful shutdowns.
      Disable this if other HA Bluetooth integrations lose
      connectivity when the add-on restarts.
  debug:
    name: Debug logging
    description: Enable verbose BLE debug output in the add-on logs
  custom_config:
    name: Use custom config.yaml
    description: >-
      Use a custom config.yaml file from /share/ble-scale-sync/config.yaml
      instead of generating one from the options above.
      For advanced users who need multi-user support or additional exporters.
