name: BLE Scale Sync
# x-release-please-start-version
version: 1.31.0
# x-release-please-end
slug: ble-scale-sync
description: >-
  Read BLE smart scales and export to Garmin Connect, MQTT (HA auto-discovery),
  InfluxDB, and more
url: https://github.com/KristianP26/ble-scale-sync
documentation: >-
  https://github.com/KristianP26/ble-scale-sync/blob/main/ble-scale-sync-addon/DOCS.md
support: https://github.com/KristianP26/ble-scale-sync/issues
panel_icon: mdi:scale-bathroom
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
host_network: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
# The last BLE recovery tier runs `rfkill block/unblock bluetooth`, which only
# needs write access to this device node (the add-on already runs as root).
# Without the mapping the tier fails on every install. The Supervisor skips a
# path the host does not have, so this cannot stop the add-on from starting.
devices:
  - /dev/rfkill
# The Supervisor's default AppArmor profile denies the D-Bus method calls this
# add-on needs, so it dies on the very first `Hello` handshake to
# org.freedesktop.DBus before any BLE scan starts. Running unconfined is what
# the standalone Docker image already does. Confinement buys little here: the
# add-on already runs as root with host_network, host_dbus, NET_ADMIN and
# NET_RAW. A custom apparmor.txt would be the tidier fix, but a profile that
# fails to parse breaks add-on install AND update for every user, and it cannot
# be tested in CI. See issue #271.
apparmor: false
hassio_api: true
# run.sh reads the Mosquitto credentials from GET http://supervisor/services/mqtt
# (mqtt_auto). The Supervisor answers 403 to any add-on that has not declared
# the service here, so without this entry auto-detection could never succeed.
# `want`, not `need`: MQTT is optional, a Garmin-only install has no broker.
services:
  - mqtt:want
map:
  - share:rw
options:
  scale_mac: ''
  ble_transport: local
  ble_adapter: ''
  force_scale_adapter: ''
  qn_protocol_byte: ''
  qn_report_byte: ''
  qn_weight_ack: ''
  qn_a4_prelude: ''
  qn_time_sync_long: ''
  qn_config_long: ''
  auto_clear_stale_bond: false
  preemptive_adapter_reset: true
  adapter_privacy: false
  esphome_proxy_host: ''
  esphome_proxy_port: 6053
  esphome_proxy_encryption_key: ''
  mqtt_proxy_broker: shared
  mqtt_proxy_device_id: esp32-ble-proxy
  mqtt_proxy_topic_prefix: ble-proxy
  mqtt_proxy_embedded_broker_port: 1883
  mqtt_proxy_username: ''
  mqtt_proxy_password: ''
  proxy_liveness_timeout_min: 30
  weight_unit: kg
  height_unit: cm
  display_unit: weight_unit
  user_name: Default
  user_height: 170
  user_birth_date: '1990-01-01'
  user_gender: male
  user_is_athlete: false
  user_weight_min: 40
  user_weight_max: 150
  out_of_range: warn
  mqtt_enabled: true
  mqtt_auto: true
  mqtt_broker_url: ''
  mqtt_username: ''
  mqtt_password: ''
  mqtt_topic: scale/body-composition
  mqtt_ha_discovery: true
  mqtt_ha_device_name: BLE Scale
  garmin_enabled: false
  garmin_email: ''
  garmin_password: ''
  garmin_weight_only: false
  garmin_upload_timeout_sec: 180
  scan_cooldown: 30
  idle_rescan_delay: 5
  retry_failed_exports: true
  reset_bluetooth: true
  debug: false
  update_check: true
  custom_config: false
schema:
  scale_mac: str?
  ble_transport: list(local|esphome-proxy|mqtt-proxy)
  ble_adapter: str?
  force_scale_adapter: str?
  qn_protocol_byte: str?
  qn_report_byte: str?
  qn_weight_ack: str?
  qn_a4_prelude: str?
  qn_time_sync_long: str?
  qn_config_long: str?
  auto_clear_stale_bond: bool?
  preemptive_adapter_reset: bool?
  adapter_privacy: bool?
  esphome_proxy_host: str?
  esphome_proxy_port: port?
  esphome_proxy_encryption_key: password?
  mqtt_proxy_broker: list(shared|embedded)
  mqtt_proxy_device_id: str?
  mqtt_proxy_topic_prefix: str?
  mqtt_proxy_embedded_broker_port: port?
  mqtt_proxy_username: str?
  mqtt_proxy_password: password?
  proxy_liveness_timeout_min: int(0,1440)?
  weight_unit: list(kg|lbs)
  height_unit: list(cm|in)
  display_unit: list(weight_unit|kg|lbs|st)
  user_name: str
  user_height: int(50,250)
  user_birth_date: str
  user_gender: list(male|female)
  user_is_athlete: bool
  user_weight_min: int(10,300)
  user_weight_max: int(10,500)
  out_of_range: list(warn|skip)
  mqtt_enabled: bool
  mqtt_auto: bool
  mqtt_broker_url: str?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic: str
  mqtt_ha_discovery: bool
  mqtt_ha_device_name: str
  garmin_enabled: bool
  garmin_email: str?
  garmin_password: password?
  garmin_weight_only: bool?
  garmin_upload_timeout_sec: int(10,900)?
  scan_cooldown: int(5,3600)
  idle_rescan_delay: int(0,3600)?
  retry_failed_exports: bool?
  reset_bluetooth: bool
  debug: bool
  update_check: bool?
  custom_config: bool
